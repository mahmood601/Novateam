<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova App</title>
<meta name="description" content="Nova Team App">

<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any">

<meta name="theme-color" id="theme-color-meta" content="#ffffff">

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <!-- index.html داخل head -->
<script>
  const theme = localStorage.getItem("theme") || 'light';
  if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
  
</script>
  </body>
</html>
